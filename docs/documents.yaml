# zdocs registry of robarm-me (doc-architecture.md §3).
# It lists this repo's own documents first, then the upstream documents. Upstream documents are
# built locally from their west checkouts (doc_dir), so that links into upstream needs resolve
# in this build (D35). Indirect upstream documents are listed by hand until zdocs #26/#27 land.
# Format: tools/zdocs/doc/manual/reference/registry-schema.rst.
# base_url is only used for links outside the HTML tree (PDFs, iteration 2).
base_url: "https://tiacsys.github.io/robarm-manifest/"

groups:
  - id: g-me
    title: "Mechanical"
  - id: g-sys
    title: "System"

documents:
  # own documents: the V-model documents in docs/<id>/, per-deliverable documents in a sub-folder
  # (docs/assemblies/; tiacsys/xdmod#69 Q8, CK-A7)
  me-req:
    title: "ME Requirements Specification"
    group: g-me
    version_project: robarm-me
    builders: [html]
    needs: {source: json}

  me-design:
    title: "ME Design"
    group: g-me
    version_project: robarm-me
    builders: [html]
    needs: {source: json}

  me-test-spec:
    title: "ME Test Specification"
    group: g-me
    version_project: robarm-me
    builders: [html]
    needs: {source: json}

  me-test-report:
    title: "ME Test Report"
    group: g-me
    version_project: robarm-me
    builders: [html]
    needs: {source: json}

  asm-canary-assembly:
    title: "Canary Assembly"
    group: g-me
    doc_dir: assemblies/asm-canary-assembly
    version_project: robarm-me
    builders: [html]
    needs: {source: json}

  # upstream documents (built locally from the sibling west projects, D35)
  se-req:
    title: "Stakeholder and System Requirements Specification"
    group: g-sys
    doc_dir: ../../robarm-syseng/docs/se-req
    version_project: robarm-syseng
    builders: [html]
    needs: {source: json}
  se-arch:
    title: "System Architecture"
    group: g-sys
    doc_dir: ../../robarm-syseng/docs/se-arch
    version_project: robarm-syseng
    builders: [html]
    needs: {source: json}
