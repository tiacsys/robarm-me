# Print profile `pla-standard` (XD-ADR-0024): the slicer settings of printed parts whose
# PrintProfile is pla-standard. `curatrix cam robarm-me <asm>` copies this file next to the
# 3MF and STL of each such part; no G-code is made (iteration 1).
# Format: PrusaSlicer / OrcaSlicer .ini keys.
filament_type = PLA
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
nozzle_diameter = 0.4
temperature = 210
bed_temperature = 60
support_material = 0
